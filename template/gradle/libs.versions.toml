[versions]
q4j = "0.14.1"
aspectj = "1.9.27"
testng = "7.12.0"
checkstyle = "14.4.0"
spotbugs-plugin = "6.5.13"
archgate = "0.1.2"

[libraries]
q4j-config = { module = "dev.quokkify:config", version.ref = "q4j" }
q4j-testng = { module = "dev.quokkify:testng", version.ref = "q4j" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }
testng = { module = "org.testng:testng", version.ref = "testng" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
archgate-bom = { module = "dev.quokkify.archgate:archgate-bom", version.ref = "archgate" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
archgate = { id = "dev.quokkify.archgate", version.ref = "archgate" }
